name: CampusPlace CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    env:
      MONGODB_URI: mongodb://localhost:27017/campusplace_test
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-dummy-cryptographic-secret-must-be-32-chars-long
      STORAGE_PROVIDER: local
      ALLOW_SEED: false
      ALLOW_DEMO_SEED: false

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest Suite
        run: npm test

      - name: Run Production Next.js Build
        run: npm run build
